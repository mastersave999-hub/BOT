<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />
    <title>ออฟไลน์ | Battle of Talingchan</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #020617; color: #e2e8f0; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 440px; padding: 32px; text-align: center; border: 1px solid #334155; border-radius: 20px; background: #0f172a; }
      h1 { color: #fbbf24; font-size: 1.5rem; }
      p { color: #cbd5e1; line-height: 1.7; }
      button { margin-top: 12px; border: 0; border-radius: 10px; padding: 12px 18px; background: #d97706; color: #020617; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>ขณะนี้ออฟไลน์</h1>
      <p>เชื่อมต่ออินเทอร์เน็ตแล้วลองโหลดหน้าเกมอีกครั้ง</p>
      <button type="button" onclick="location.reload()">ลองอีกครั้ง</button>
    </main>
  </body>
</html>
